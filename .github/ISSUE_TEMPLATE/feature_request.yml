name: Feature request
description: Propose a focused Loon improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Mesh problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Include example commands and outputs when relevant.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Airtime, privacy, and reliability impact
      description: Explain when it transmits, what it stores, and how it fails safely.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Target hardware
      options:
        - Heltec WiFi LoRa 32 V3
        - RAK WisMesh Repeater Mini / RAK4631
        - Platform-independent
    validations:
      required: true
