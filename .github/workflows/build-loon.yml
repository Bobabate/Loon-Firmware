name: Build Loon Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version (for example v1.17.1-L7)
        required: true
        type: string
      boards:
        description: Boards to build
        required: true
        default: all
        type: choice
        options:
          - all
          - heltec-v3
          - heltec-v4
          - heltec-v4-oled
          - heltec-v4-no-display
          - rak4631
          - t114
          - t114-display
          - t114-no-display
          - sensecap-p1
          - sensecap-p1-pro

permissions:
  contents: read

jobs:
  choose-boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          BOARD_CHOICE: ${{ inputs.boards }}
        run: |
          case "$BOARD_CHOICE" in
            all)
              value='[{"name":"Heltec-V3","target":"Loon_heltec_v3_repeater"},{"name":"Heltec-V4.3-OLED","target":"Loon_heltec_v4_repeater"},{"name":"Heltec-V4.3-No-Display","target":"Loon_heltec_v4_without_display_repeater"},{"name":"RAK4631-Repeater-Mini","target":"Loon_RAK4631_repeater_mini"},{"name":"Heltec-T114-Display","target":"Loon_heltec_t114_repeater"},{"name":"Heltec-T114-No-Display","target":"Loon_heltec_t114_without_display_repeater"},{"name":"SenseCAP-Solar-P1-P1-Pro","target":"Loon_SenseCap_Solar_repeater"}]'
              ;;
            heltec-v3)
              value='[{"name":"Heltec-V3","target":"Loon_heltec_v3_repeater"}]'
              ;;
            heltec-v4)
              value='[{"name":"Heltec-V4.3-OLED","target":"Loon_heltec_v4_repeater"},{"name":"Heltec-V4.3-No-Display","target":"Loon_heltec_v4_without_display_repeater"}]'
              ;;
            heltec-v4-oled)
              value='[{"name":"Heltec-V4.3-OLED","target":"Loon_heltec_v4_repeater"}]'
              ;;
            heltec-v4-no-display)
              value='[{"name":"Heltec-V4.3-No-Display","target":"Loon_heltec_v4_without_display_repeater"}]'
              ;;
            rak4631)
              value='[{"name":"RAK4631-Repeater-Mini","target":"Loon_RAK4631_repeater_mini"}]'
              ;;
            t114)
              value='[{"name":"Heltec-T114-Display","target":"Loon_heltec_t114_repeater"},{"name":"Heltec-T114-No-Display","target":"Loon_heltec_t114_without_display_repeater"}]'
              ;;
            t114-display)
              value='[{"name":"Heltec-T114-Display","target":"Loon_heltec_t114_repeater"}]'
              ;;
            t114-no-display)
              value='[{"name":"Heltec-T114-No-Display","target":"Loon_heltec_t114_without_display_repeater"}]'
              ;;
            sensecap-p1|sensecap-p1-pro)
              value='[{"name":"SenseCAP-Solar-P1-P1-Pro","target":"Loon_SenseCap_Solar_repeater"}]'
              ;;
            *)
              echo "Unknown board choice: $BOARD_CHOICE" >&2
              exit 1
              ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: choose-boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.choose-boards.outputs.matrix) }}

    steps:
      - name: Check out Loon
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Report PlatformIO version
        run: pio --version

      - name: Build ${{ matrix.board.name }}
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
        run: ./build.sh build-firmware "${{ matrix.board.target }}"

      - name: Verify build output
        shell: bash
        env:
          TARGET: ${{ matrix.board.target }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-L[0-9]+$ ]]; then
            echo "Invalid Loon firmware version: $VERSION" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(out/"$TARGET"-*)
          if (( ${#files[@]} == 0 )); then
            echo "No packaged firmware files were produced for $TARGET" >&2
            exit 1
          fi
          if [[ "$TARGET" == "Loon_heltec_v3_repeater" || "$TARGET" == Loon_heltec_v4_* ]]; then
            app=(out/"$TARGET"-"$VERSION".bin)
            merged=(out/"$TARGET"-"$VERSION"-merged.bin)
            if (( ${#app[@]} != 1 || ${#merged[@]} != 1 )); then
              echo "ESP32 build must contain one application and one merged image" >&2
              exit 1
            fi
            if ! strings ".pio/build/$TARGET/firmware.elf" | grep -Fq "MeshCore-OTA"; then
              echo "ESP32 firmware is missing Wi-Fi OTA support" >&2
              exit 1
            fi
          else
            uf2=(out/"$TARGET"-*.uf2)
            if (( ${#uf2[@]} != 1 )); then
              echo "nRF52 build must contain one UF2 image" >&2
              exit 1
            fi
          fi
          sha256sum "${files[@]}" | tee out/SHA256SUMS.txt

      - name: Upload ${{ matrix.board.name }} firmware
        uses: actions/upload-artifact@v7
        with:
          name: Loon-${{ matrix.board.name }}-${{ inputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 14
